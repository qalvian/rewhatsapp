<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="timeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Speech bubble with tail -->
  <path d="M 32 6 C 17.6 6 6 16.8 6 30 C 6 35.8 8.3 41.1 12.2 45.3 L 9.2 56.4 C 8.9 57.5 9.9 58.4 10.9 58.1 L 22.4 53.7 C 25.4 54.8 28.6 55.4 32 55.4 C 46.4 55.4 58 44.6 58 31.4 C 58 17.4 46.4 6 32 6 Z"
        fill="url(#bubbleGrad)" filter="url(#glow)" />

  <!-- Inner subtle border -->
  <path d="M 32 8 C 18.7 8 8 17.9 8 30 C 8 35.3 10.1 40.2 13.7 44.1 L 11.2 53.3 L 20.8 49.6 C 24.1 50.7 27.9 51.4 32 51.4 C 45.3 51.4 56 41.5 56 30 C 56 18.5 45.3 8 32 8 Z"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Rewind Hourglass & Play Motif -->
  <!-- Upper & lower chambers -->
  <path d="M 22 20 L 42 20 L 34 30 L 42 40 L 22 40 L 30 30 Z" fill="none" stroke="url(#timeGrad)" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Center time particle & sweep arrow -->
  <circle cx="32" cy="30" r="2.5" fill="#fef3c7" />
  <!-- Circular rewind arc -->
  <path d="M 26 27 A 8 8 0 1 1 25.5 35" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <polygon points="23,24 28,26 25,30" fill="#ffffff" />
</svg>
